name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, dev2, dev3 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest test_utils.py -v
  
  # Авто-генерация документации
  docs:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate documentation
      run: |
        mkdir -p docs
        echo "# API Documentation" > docs/index.md
        echo "Generated on: $(date)" >> docs/index.md
        echo "" >> docs/index.md
        echo "## Functions" >> docs/index.md
        grep -E "^def " utils.py >> docs/index.md || true
    
    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/
